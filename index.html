<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un p’tit chat qui aime son doudou</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--cream:#fbf4e6;--ink:#4a2c2a;--red:#b3262e;--sh:rgba(90,40,30,.28);--W:min(44vw,calc(68vh/1.4),340px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Patrick Hand','Comic Sans MS',cursive,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden}
.stage{perspective:2400px;width:calc(var(--W)*2);height:calc(var(--W)*1.4)}
.stage.single{--W:min(90vw,calc(68vh/1.4),380px);width:var(--W)}
.book{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1s ease;transform:translateX(calc(var(--W)*-.5))}
.book.open{transform:none}.book.end{transform:translateX(calc(var(--W)*.5))}.single .book{transform:none!important}
.sheet{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.5,.05,.25,1),opacity .9s;cursor:pointer}
.single .sheet{left:0;width:100%}.sheet.f{transform:rotateY(-180deg)}.single .sheet.f{opacity:0;pointer-events:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-sizing:border-box;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--cream)}
.front{border-radius:2px 14px 14px 2px;box-shadow:0 10px 26px var(--sh),inset 16px 0 18px -14px rgba(0,0,0,.25)}
.back{transform:rotateY(180deg);border-radius:14px 2px 2px 14px;box-shadow:inset -16px 0 18px -14px rgba(0,0,0,.25)}
.single .front{border-radius:6px 14px 14px 6px}
.cover{background:var(--red);color:var(--cream);box-shadow:0 10px 26px var(--sh),inset 12px 0 0 rgba(0,0,0,.22)}
.cover.back{box-shadow:inset -12px 0 0 rgba(0,0,0,.22)}
.garde{background:repeating-linear-gradient(90deg,var(--cream) 0 14px,#f3e6cc 14px 28px)}
.pic{flex:0 0 66%;width:100%;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.cover .pic{flex-basis:72%;border:3px solid var(--cream)}
h1{font-family:'Caveat',cursive;font-weight:700;margin:4px 0;line-height:1.05}
.cover h1{font-size:clamp(1.4rem,4.4vw,2.3rem);margin-top:10px}
.tp h1{color:var(--red);font-size:clamp(1.8rem,5vw,3rem)}
.sub{opacity:.85;font-size:clamp(.8rem,1.8vw,1.1rem)}
.txt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(.85rem,2vw,1.3rem);line-height:1.3;padding:6px 4px 14px}
.ind{margin-top:6px;color:var(--red);font-size:.85em}
.num{position:absolute;bottom:6px;font-size:.8rem;opacity:.5}
.q{font-size:clamp(.85rem,1.9vw,1.2rem);line-height:1.3}
.opt{display:block;width:100%;margin:5px 0;font-family:inherit;font-size:clamp(.85rem,1.9vw,1.1rem);border:2px solid var(--red);background:#fff;color:var(--red);border-radius:18px;padding:7px 8px;cursor:pointer}
.opt:hover{background:var(--red);color:#fff}
.ans{font-size:clamp(.8rem,1.8vw,1.05rem);margin-top:6px}.ans a{color:var(--red);font-weight:bold}
.ctrl{display:flex;gap:12px;align-items:center;min-height:44px}
.ctrl button{font-family:inherit;font-size:1.1rem;border:0;border-radius:22px;padding:9px 20px;background:var(--red);color:#fff;cursor:pointer}
.ctrl button:disabled{opacity:.25;cursor:default}.hint{font-size:.95rem;opacity:.7;min-width:150px;text-align:center}
</style></head><body>

var B_=document.getElementById('book'),ST=document.getElementById('st'),cur=0,N,single=null;
function isS(){return innerWidth<720||innerHeight>innerWidth}
function face(p,s){return '<div class="face '+s+' '+p[0]+'">'+p[1]+'</div>'}
function build(){var ns=isS();if(single!==null&&ns!==single)cur=ns?cur*2:Math.ceil(cur/2);single=ns;
 ST.className='stage'+(single?' single':'');B_.innerHTML='';var u=[];
 if(single)PG.forEach(function(p){u.push([p])});else for(var i=0;i<PG.length;i+=2)u.push([PG[i],PG[i+1]]);
 N=u.length;cur=Math.min(cur,single?N-1:N);

addEventListener('resize',function(){if(isS()!==single)build()});
build();
